spring.application.name=market-data-service
server.port=8085

# JWT Configuration (HMAC-SHA256 Secret)
app.jwt.secret=iboss-market-data-service-secure-jwt-signing-secret-key-2026-okx-proxy-crypto
app.jwt.expiration-ms=86400000

# Market Data Engine Configuration
market.data.provider=mock
market.data.okx.rest-url=https://www.okx.com/api/v5/market
market.data.okx.ws-url=wss://ws.okx.com:8443/ws/v5/public

# Logging
logging.level.com.assingment.iboss=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.security=INFO

# SpringDoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Redis Connection Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Redis Cache TTLs (in seconds or minutes)
app.cache.redis.default-ttl-seconds=60
app.cache.redis.tickers-ttl-seconds=3
app.cache.redis.orderbook-ttl-seconds=2
app.cache.redis.pairs-ttl-minutes=10
app.cache.redis.user-profile-ttl-minutes=5
